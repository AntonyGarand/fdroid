    en-US: Sends anonymous play stats (game, level, score, time, result) and page visits. On by default; turn it off in Settings.

Name: Arcade Feed
Summary: An endless feed of one-level arcade games
Description: |-
  An endless, scrollable feed of one-level arcade games: swap, bounce, dodge and aim. In English and French.

  * Each card is a short level scored with stars. Difficulty adapts to how you play, per game.
  * Profile with stats and best scores.
  * Works fully offline, no account, no ads. Progress stays on your device.

  Same games as https://arcade.garand.dev, bundled into the app.
